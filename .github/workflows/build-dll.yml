name: Build LoversLedger.dll

on:
  workflow_dispatch:
  push:
    paths:
      - 'SKSE_Source/**'
      - '.github/workflows/build-dll.yml'

jobs:
  build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:/vcpkg
      VCPKG_BINARY_SOURCES: clear
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch CommonLibSSE-NG
        uses: actions/checkout@v4
        with:
          repository: CharmedBaryon/CommonLibSSE-NG
          ref: main
          path: extern/CommonLibSSE-NG
          submodules: recursive

      - name: Verify vcpkg (preinstalled on runner)
        shell: bash
        run: |
          ls "$VCPKG_ROOT/vcpkg.exe" && "$VCPKG_ROOT/vcpkg.exe" version

      - name: Configure
        working-directory: SKSE_Source
        env:
          COMMONLIB_SSE_FOLDER: ${{ github.workspace }}/extern/CommonLibSSE-NG
        run: |
          cmake -S . -B build/release `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DSKYRIM_MODS_FOLDER="${{ github.workspace }}/out"

      - name: Build
        working-directory: SKSE_Source
        run: cmake --build build/release --config Release --target LoversLedger --parallel

      - name: Locate artifact
        working-directory: SKSE_Source
        run: Get-ChildItem -Recurse -Filter LoversLedger.dll | Select-Object FullName,Length

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: LoversLedger-dll
          path: |
            SKSE_Source/build/release/**/LoversLedger.dll
            SKSE_Source/build/release/**/LoversLedger.pdb
            out/**/LoversLedger.dll
          if-no-files-found: error
